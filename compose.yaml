services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: spotify
      POSTGRES_PASSWORD: spotify
      POSTGRES_DB: spotify_stats_dev
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U spotify -d spotify_stats_dev']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-data:
